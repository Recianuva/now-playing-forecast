<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weathergirl tracker desk</title>
  
  <!-- Direct External Google Fonts Engine -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Your Matched Ambient Rain Container -->
  <div id="rain-container" class="rain-overlay"></div>

  <!-- Adaptive Desktop/Mobile Flex Container -->
  <main class="layout-container">
    
    <!-- Left Widescreen Pane: Embedded YouTube Player Window Target -->
    <section class="player-wrapper" id="player-container">
      <div id="api-player"></div>
    </section>

    <!-- Right Widescreen Pane: Control Center Deck -->
    <div class="control-deck">
      
      <!-- Dynamic Song Info Status Panel -->
      <section class="status-card">
        <div class="card-header">
          <span class="status-label">PLAYING CHANNELS</span>
          <div class="visualizer-container">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
        
        <div class="track-info">
          <h2 id="song-title" class="song-title">weathergirl</h2>
          <p id="artist-name" class="artist-name">FLAVOR FOLEY ft. Eleanor Forte</p>
        </div>
      </section>

      <!-- Channel Selector Switch Matrix -->
      <nav class="track-selector">
        <button class="pixel-btn active" onclick="switchTrack('M7VSEZOQIlg', 'weathergirl', 'FLAVOR FOLEY ft. Eleanor Forte', this)">[ ORIGINAL ]</button>
        <button class="pixel-btn" onclick="switchTrack('OaPcIO2S0Dw', 'weathergirl (Cover)', 'LadyAuro', this)">[ COVER A ]</button>
        <button class="pixel-btn" onclick="switchTrack('49djtI4zq8I', 'weathergirl (Cover)', 'y3llowx', this)">[ COVER B ]</button>
      </nav>

    </div>

  </main>

  <!-- Load the official third-party YouTube Player API script securely -->
  <script src="https://youtube.com"></script>
  <script src="script.js"></script>
</body>
</html>
