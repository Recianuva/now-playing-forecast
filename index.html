<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weathergirl tracker desk</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="layout-container">
    
    <section class="player-wrapper" id="player-container">
      <div id="api-player"></div>
    </section>

    <div class="control-deck">
      
      <section class="status-card">
        <div class="card-header">
          <span class="status-label">PLAYING CHANNELS</span>
          <div class="visualizer-container">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
        
        <div class="track-info">
          <h2 id="song-title" class="song-title">weathergirl</h2>
          <p id="artist-name" class="artist-name">FLAVOR FOLEY ft. Eleanor Forte</p>
        </div>
      </section>

      <nav class="track-selector">
        <button class="pixel-btn active" onclick="switchTrack('M7VSEZOQIlg', 'weathergirl', 'FLAVOR FOLEY ft. Eleanor Forte', this)">[ ORIGINAL ]</button>
        <button class="pixel-btn" onclick="switchTrack('OaPcIO2S0Dw', 'weathergirl (Cover)', 'LadyAuro', this)">[ COVER A ]</button>
        <button class="pixel-btn" onclick="switchTrack('M7VSEZOQIlg', 'weathergirl (Remix)', 'Track 03', this)">[ COVER B ]</button>
      </nav>

    </div>

  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
