<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weathergirl tracker desk</title>
  
  <!-- Direct External Google Fonts Engine (Bypasses all CSS folder pathway breaks) -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Your active CSS file path (Keep this matching wherever your folder is!) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Slanted Rain Overlay System -->
  <div id="rain-canvas" class="rain-overlay"></div>

  <!-- Adaptive Desktop/Mobile Flex Container -->
  <main class="layout-container">
    
    <!-- Left Widescreen Pane: Embedded YouTube Player Wrapper -->
    <section class="player-wrapper" id="player-container">
      <iframe 
        id="video-frame"
        src="https://youtube.com" 
        title="weathergirl playlist player" 
        frameborder="0" 
        allow="autoplay; encrypted-media; picture-in-picture" 
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </section>

    <!-- Right Widescreen Pane: Control Center Deck -->
    <div class="control-deck">
      
      <!-- Dynamic Song Info Status Panel -->
      <section class="status-card">
        <div class="card-header">
          <span class="status-label">PLAYING CHANNELS</span>
          <div class="visualizer-container">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
        
        <div class="track-info">
          <h2 id="song-title" class="song-title">weathergirl</h2>
          <p id="artist-name" class="artist-name">FLAVOR FOLEY ft. Eleanor Forte</p>
        </div>
      </section>

      <!-- Channel Selector Switch Matrix -->
      <nav class="track-selector">
        <button class="pixel-btn active" onclick="switchTrack('M7VSEZOQIlg', 'weathergirl', 'FLAVOR FOLEY ft. Eleanor Forte', this)">[ ORIGINAL ]</button>
        <button class="pixel-btn" onclick="switchTrack('OaPcIO2S0Dw', 'weathergirl (Cover)', 'LadyAuro', this)">[ COVER A ]</button>
        <button class="pixel-btn" onclick="switchTrack('M7VSEZOQIlg', 'weathergirl (Remix)', 'Track 03', this)">[ COVER B ]</button>
      </nav>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
